<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Clean overrides for Oat to center the nav and main nicely */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .container { max-width: 800px; padding-top: 2rem; }
    nav ul { display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    footer { margin-top: auto; padding-bottom: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <a href="/" style="font-weight: bold; font-size: 1.75rem;">{{ site.title }}</a>
      <ul>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/cv/">CV</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="container">
    <p style="color: var(--muted-foreground); font-size: 0.9rem; margin-top: 2rem;">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>
</body>
</html>
