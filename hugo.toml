baseURL = "https://mathanamathav.github.io/"
languageCode = "en-us"
title = "Mathana Mathav A.S"
theme = "hugo-bearblog"
enableRobotsTXT = true
# Page "last modified" dates come from git history (used by the home page "Last updated" line).
enableGitInfo = true

[params]
  description = "Developer."
  # Italic line under the name on the home page.
  tagline = "Developer / Builder / Tinkerer"
  dateFormat = "2006-01-02"
  hideMadeWithLine = false
  # Site-wide OG/Twitter card fallback for pages without their own cover image.
  images = ["images/og-default.png"]

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/blog/"
  weight = 2

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 3

[[menu.main]]
  identifier = "cv"
  name = "CV"
  url = "/cv/"
  weight = 4

[caches]
  [caches.images]
    dir = ":cacheDir/images"

# Emit /llms.txt (a curated, agent-readable index) alongside the home page.
[outputs]
  home = ["HTML", "RSS", "llms"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"
